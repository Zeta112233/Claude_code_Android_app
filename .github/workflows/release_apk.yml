name: Build and Release APK

on:
  push:
    tags:
      # 触发条件：推送 v 开头的版本号 tag（v1.0 / v1.0.0 / v2.3-beta 等）
      # snapshot-* tag 不会触发，避免与 Ubuntu 快照 release 冲突
      - 'v[0-9]+.[0-9]+*'
  # 允许在 GitHub 网页上手动触发（输入版本号）
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本 tag（如 v1.0.0），不带 v 也行'
        required: true

permissions:
  contents: write   # 创建/更新 release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SNAPSHOT_RELEASE_TAG: snapshot-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 确保 release APK 内置 Ubuntu + Claude 快照；缺失时从 release 下载，仍失败则阻断发布。
      - name: Ensure Ubuntu + Claude snapshot asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p app/src/main/assets/ubuntu-snapshot
          SNAPSHOT="$(find app/src/main/assets/ubuntu-snapshot -name '*.tar.xz' -size +100M | head -1 || true)"
          if [ -n "$SNAPSHOT" ]; then
            echo "✓ Snapshot already present from Git LFS: $SNAPSHOT"
            ls -lh app/src/main/assets/ubuntu-snapshot/
          else
            echo "[*] No valid local snapshot found; downloading $SNAPSHOT_RELEASE_TAG..."
            rm -f app/src/main/assets/ubuntu-snapshot/*.tar.xz
            gh release download "$SNAPSHOT_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern '*.tar.xz' \
              --dir app/src/main/assets/ubuntu-snapshot/
            SNAPSHOT="$(find app/src/main/assets/ubuntu-snapshot -name '*.tar.xz' -size +100M | head -1 || true)"
            if [ -z "$SNAPSHOT" ]; then
              echo "::error::Ubuntu snapshot asset is missing; refusing to publish a slim APK."
              ls -lh app/src/main/assets/ubuntu-snapshot/ || true
              exit 1
            fi
            echo "✓ Snapshot downloaded: $SNAPSHOT"
            ls -lh app/src/main/assets/ubuntu-snapshot/
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 找到产物 + 计算 sha256
      - name: Collect artifacts
        id: artifacts
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*universal*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No universal APK found under app/build/outputs/apk/debug"
            ls -R app/build/outputs/apk/ || true
            exit 1
          fi
          DIR=$(dirname "$APK")
          BASE=$(basename "$APK")
          (cd "$DIR" && sha256sum "$BASE" > "${BASE}.sha256")
          ls -lh "$DIR"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$DIR/${BASE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ inputs.version }}"
            case "$T" in v*) ;; *) T="v$T" ;; esac
          else
            T="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: release_notes
        run: |
          if [ -f release/release-notes.md ]; then
            cp release/release-notes.md release-body.md
          else
            printf '%s\n' '## PortalAgent Release' '' 'Download the universal APK below. See README for setup notes.' > release-body.md
          fi
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create / update release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.sha }}
